<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">

<style>

#pl,#pr{display:contents}

.ov .card.sel{border-color:var(--gold);background:#2b2110}

#mt{font-size:46px}

 canvas{grid-column:2;grid-row:2;height:100%;object-fit:contain}

 #pl{grid-column:1;grid-template-columns:1fr 1fr}#pr{grid-column:3}
 #pad button{height:auto;min-height:56px}}
</style></head><body>
