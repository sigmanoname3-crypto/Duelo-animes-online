<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">

<style>

 #pad button[data-k=fu]{width:42px!important;height:42px!important;right:calc(62px + env(safe-area-inset-right,0px));bottom:calc(184px + env(safe-area-inset-bottom,0px))}

 #pad button[data-k=g]{width:46px!important;height:46px!important;right:calc(156px + env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px))}
 #pad button[data-k=d]{width:44px!important;height:44px!important;right:calc(160px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
 #pad button[data-k=l]{width:58px!important;height:58px!important;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
 #pad button[data-k=r]{width:58px!important;height:58px!important;left:calc(84px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
 #pad button[data-k=jb]{font-size:15px}
 #pad button[data-k=l],#pad button[data-k=r]{font-size:20px}
 #pad button[data-k=sp],#pad button[data-k=sp2]{font-size:8px}}
</style></head><body>
<div id="hud"><div class="side"><div class="n" id="n1">Goko</div><div class="bar"><i id="hp1"></i></div><div class="bar en"><i id="en1"></i></div></div>

</div>

<script>

{skin:'#ffe27a',hair:'#ffd21f',shirt:'#3fc04a',pants:'#6b4030',shoe:'#3a2314',ki:'#9dff6a'},
{skin:'rgba(0,0,0,0)',hair:'rgba(0,0,0,0)',shirt:'rgba(0,0,0,0)',pants:'rgba(0,0,0,0)',shoe:'rgba(0,0,0,0)',ki:'#9dff6a'}];
let t2=false,pk=[],opk=[],lastCh=-1,S=null,mode='',me=0,ws=null,sel=0,cur=0,osel=1,oready=false,waiting=false,ended=false,last=0,inp={};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const ov=$('ov'),send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));

const PORT=[];
function portrait(i){if(PORT[i])return PORT[i];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
 const bg=[['#2a63d8','#122a6e'],['#ff9a3c','#8a3a10'],['#d94a3a','#5c1710'],['#4fd16a','#14502a']][i],sk=['#f2c7a3','#ffe0a8','#f8cfae','#f8cfae'][i],cl=['#f0731c','#ff7a1a','#c4352b','#2f7be8'][i];
 const gr=g.createLinearGradient(0,0,0,64);gr.addColorStop(0,bg[0]);gr.addColorStop(1,bg[1]);g.fillStyle=gr;g.fillRect(0,0,64,64);
 const poly=(pts,col)=>{g.fillStyle=col;g.beginPath();pts.forEach((q,k)=>k?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill()};
 const eye=(ex,ey)=>{g.fillStyle='#fff';g.beginPath();g.ellipse(ex,ey,3.6,4.4,0,0,7);g.fill();g.fillStyle='#1a1a22';g.beginPath();g.arc(ex+.6,ey+.6,2.1,0,7);g.fill()};
 g.fillStyle=cl;g.beginPath();g.ellipse(32,67,25,15,0,0,7);g.fill();
 if(i===0)poly([[16,36],[10,14],[22,22],[23,4],[31,19],[41,3],[42,21],[54,14],[48,36]],'#17131a');
 if(i===1)poly([[16,36],[10,16],[22,23],[22,5],[31,20],[42,4],[42,22],[54,16],[48,36]],'#ffd21f');
 if(i===2){g.fillStyle='#17131a';g.fillRect(16,26,32,18)}
 if(i===3){g.fillStyle='#6b4030';g.fillRect(16,26,32,14)}
 g.fillStyle=sk;g.beginPath();g.arc(32,37,15,0,7);g.fill();
 if(i===0)poly([[18,36],[21,19],[29,28],[36,17],[43,28],[48,21],[47,36],[40,26],[26,26]],'#17131a');
 if(i===1){poly([[18,36],[21,19],[29,28],[36,17],[43,28],[48,21],[47,36],[40,26],[26,26]],'#ffd21f');g.fillStyle='#1f4fc8';g.fillRect(17,27,30,5);g.fillStyle='#d5dcec';g.fillRect(26,26.5,12,6)}
 eye(25,38);eye(39,38);
 g.strokeStyle='#8a4a3a';g.lineWidth=1.6;g.beginPath();g.arc(32,44,5,.2,Math.PI-.2);g.stroke();

 if(i===2){g.strokeStyle='#a52a2a';g.lineWidth=1.8;g.beginPath();g.moveTo(22,43);g.lineTo(25,49);g.stroke();
  g.fillStyle='#efcf86';g.beginPath();g.arc(32,25,15,Math.PI,Math.PI*2);g.fill();g.fillStyle='#c4352b';g.fillRect(17,19,30,5);g.fillStyle='#f3d795';g.beginPath();g.ellipse(32,25,27,6,0,0,7);g.fill();g.strokeStyle='#cfae66';g.lineWidth=1;g.stroke()}
 if(i===3){g.fillStyle='#2fa83a';g.strokeStyle='#1c6d25';g.lineWidth=2;g.beginPath();g.moveTo(16,29);g.quadraticCurveTo(16,6,34,6);g.quadraticCurveTo(50,6,48,29);g.closePath();g.fill();g.stroke();
  g.beginPath();g.moveTo(34,24);g.lineTo(60,26);g.lineTo(60,31);g.lineTo(34,30);g.closePath();g.fill();g.stroke();
  g.fillStyle='#ffe14a';g.font='bold 16px sans-serif';g.textAlign='center';g.fillText('\u03b1',30,23);
  g.fillStyle='#ffd23a';for(let q=0;q<3;q++){poly([[20+q*10,56],[25+q*10,48],[30+q*10,56]],'#ffd23a')}}
 return PORT[i]=c.toDataURL()}
function cards(box,pick,click){box.innerHTML='';const ar=Array.isArray(pick);
 for(let i=0;i<6;i++){const c=CH[i],e=document.createElement(click&&c?'button':'div'),on=c?(ar?pick.indexOf(i):(i===pick?0:-1)):-1;
  e.className='tile'+(on>=0?' sel':'')+(click&&i===cur?' cur':'')+(c?'':' lock');
  e.innerHTML=c?'<img src="'+portrait(i)+'" alt=""><span class="tn">'+c.n+'</span>'+(ar&&on>=0?'<b class="bd">'+(on+1)+'</b>':''):'<span class="q">?</span>';

 if(t2){
  cards($('mine'),pk,i=>{const k=pk.indexOf(i);if(k>=0)pk.splice(k,1);else if(pk.length<2)pk.push(i);else pk[1]=i;if(mode==='net')send({t:'pick',ch:pk});renderSel()});

  cards($('opp'),osel,null)}
 {const c=CH[cur]||CH[0];$('info').innerHTML=c.n+'<small>'+[c.skill,c.spName,c.sp2Name,c.pass].filter(Boolean).join(' · ')+'</small>'}
